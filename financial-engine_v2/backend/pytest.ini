[pytest]
asyncio_default_fixture_loop_scope = function
markers =
    live_eval: requires real LLM (llamacpp or Anthropic API) and eval fixtures; run with -m live_eval
    unit: pure unit test (no network, no DB, no LLM)
    integration: integration test — may exercise DB, filesystem, or in-process services
addopts = -m "not live_eval"
