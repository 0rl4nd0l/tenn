services:
  postgres:
    image: postgres:16
    container_name: fe_postgres
    network_mode: host
    environment:
      TENN_HOST_NETWORK: "true"
      POSTGRES_USER: ${POSTGRES_USER:-fe}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fe}
      POSTGRES_DB: ${POSTGRES_DB:-fe}
    volumes: [fe_pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fe} -d ${POSTGRES_DB:-fe}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7
    container_name: fe_redis
    network_mode: host
    environment:
      TENN_HOST_NETWORK: "true"

  qdrant:
    image: qdrant/qdrant:latest
    container_name: fe_qdrant
    network_mode: host
    environment:
      TENN_HOST_NETWORK: "true"
    volumes: [fe_qdrant:/qdrant/storage]

  backend:
    build: { context: ./backend }
    container_name: fe_backend
    network_mode: host
    environment:
      TENN_HOST_NETWORK: "true"
    env_file: [.env]
    volumes:
      - ./backend:/app
      - ./data:/data
      - ./scripts:/scripts
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }
      qdrant: { condition: service_started }

  worker:
    build: { context: ./worker }
    container_name: fe_worker
    network_mode: host
    environment:
      TENN_HOST_NETWORK: "true"
    env_file: [.env]
    command: ["celery","-A","app.celery_app.celery","worker","--loglevel=INFO","-Q","default,ingest,embed,score,llm_gpu,llm_cpu"]
    volumes:
      - ./backend:/app_backend
      - ./worker:/app_worker
      - ./data:/data
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }
      qdrant: { condition: service_started }

volumes:
  fe_pgdata:
  fe_qdrant:
