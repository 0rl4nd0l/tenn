services:
  postgres:
    image: postgres:16
    container_name: fe_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fe}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fe}
      POSTGRES_DB: ${POSTGRES_DB:-fe}
    ports: ["5432:5432"]
    volumes: [fe_pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fe} -d ${POSTGRES_DB:-fe}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7
    container_name: fe_redis
    ports: ["6379:6379"]

  qdrant:
    image: qdrant/qdrant:latest
    container_name: fe_qdrant
    ports: ["6333:6333"]
    volumes: [fe_qdrant:/qdrant/storage]

  backend:
    build: { context: ./backend }
    container_name: fe_backend
    env_file: [.env]
    ports: ["8000:8000"]
    volumes:
      - ./backend:/app
      - ./data:/data
      - ./scripts:/scripts
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }
      qdrant: { condition: service_started }

  worker:
    build: { context: ./worker }
    container_name: fe_worker
    env_file: [.env]
    volumes:
      - ./backend:/app_backend
      - ./worker:/app_worker
      - ./data:/data
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }
      qdrant: { condition: service_started }

volumes:
  fe_pgdata:
  fe_qdrant:
