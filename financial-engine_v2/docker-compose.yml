services:
  postgres:
    image: postgres:16
    container_name: fe_postgres
    network_mode: host
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fe}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fe}
      POSTGRES_DB: ${POSTGRES_DB:-fe}
    volumes: [fe_pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fe} -d ${POSTGRES_DB:-fe}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7
    container_name: fe_redis
    network_mode: host

  qdrant:
    image: qdrant/qdrant:latest
    container_name: fe_qdrant
    network_mode: host
    volumes: [fe_qdrant:/qdrant/storage]

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: fe_backend
    network_mode: host
    env_file: [.env.docker]
    environment:
      TENN_HOST_NETWORK: ${TENN_HOST_NETWORK:-true}
      COCKPIT_MODELS_NVME_DIR: /models/nvme
      COCKPIT_MODELS_SSD_DIR: /models/ssd
      COCKPIT_MODELS_HDD_DIR: /models/hdd
      COCKPIT_SHARED_SCRIPTS_ROOT: /workspace/scripts
      COCKPIT_WORKSPACE_ROOT: /workspace
      TENN_GIT_HEAD: ${TENN_GIT_HEAD:-}
      TENN_GIT_HEAD_SHORT: ${TENN_GIT_HEAD_SHORT:-}
      TENN_GIT_BRANCH: ${TENN_GIT_BRANCH:-}
      TENN_GIT_DIRTY: ${TENN_GIT_DIRTY:-}
      TENN_GIT_STATUS_LINE_COUNT: ${TENN_GIT_STATUS_LINE_COUNT:-}
      TENN_BUILD_TIME: ${TENN_BUILD_TIME:-}
      OLLAMA_EMBED_NUM_GPU: ${OLLAMA_EMBED_NUM_GPU:-0}
    dns:
      - 1.1.1.1
      - 8.8.8.8
    volumes:
      - ..:/workspace:ro
      - ../reports:/workspace/reports
      - ./backend:/app
      - ./shared:/app/shared
      - ./cockpit:/app/cockpit
      - ./config:/config
      - ./data:/data
      - ./scripts:/scripts
      - ../reports:/workspace-reports
      - ${TENN_MODELS_NVME_DIR:-/mnt/nvme/tenn/models}:/models/nvme:ro
      - ${TENN_LLMFIT_MODELS_DIR:-/mnt/ssd/log/ssd_data/l4nd0_cache/.cache/llmfit/models}:/models/ssd:ro
      - ${TENN_COLD_MODELS_DIR:-/mnt/hdd-cold/tenn/models}:/models/hdd:ro
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }
      qdrant: { condition: service_started }

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: fe_worker
    network_mode: host
    env_file: [.env.docker]
    environment:
      TENN_HOST_NETWORK: ${TENN_HOST_NETWORK:-true}
      OLLAMA_EMBED_NUM_GPU: ${OLLAMA_EMBED_NUM_GPU:-0}
    dns:
      - 1.1.1.1
      - 8.8.8.8
    command: ["celery", "-A", "app.celery_app.celery", "worker", "--loglevel=INFO", "-Q", "ingest,embed,score,llm_cpu"]
    volumes:
      - ./backend:/app
      - ./shared:/app/shared
      - ./data:/data
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }
      qdrant: { condition: service_started }

  gpu_worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: fe_gpu_worker
    network_mode: host
    env_file: [.env.docker]
    environment:
      TENN_HOST_NETWORK: ${TENN_HOST_NETWORK:-true}
      OLLAMA_EMBED_NUM_GPU: ${OLLAMA_EMBED_NUM_GPU:-0}
    dns:
      - 1.1.1.1
      - 8.8.8.8
    command: ["celery", "-A", "app.celery_app.celery", "worker", "--loglevel=INFO", "--concurrency=${TENN_LLM_GPU_WORKER_CONCURRENCY:-1}", "-Q", "llm_gpu"]
    volumes:
      - ./backend:/app
      - ./shared:/app/shared
      - ./data:/data
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }
      qdrant: { condition: service_started }

  fe_beat:
    build: { context: ./worker }
    container_name: fe_beat
    restart: unless-stopped
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    env_file: [.env.docker]
    working_dir: /app_worker
    command: ["celery", "-A", "worker_app.celery_app:celery", "beat", "--loglevel=INFO"]
    environment:
      PYTHONPATH: /app_backend:/app_worker
      BACKEND_APP_ROOT: /app_backend
    volumes:
      - ./backend:/app_backend
      - ./worker:/app_worker
      - ./data:/data
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }
      qdrant: { condition: service_started }

volumes:
  fe_pgdata:
  fe_qdrant:
