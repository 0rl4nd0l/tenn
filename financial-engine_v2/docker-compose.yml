services:
  postgres:
    image: postgres:16
    container_name: fe_postgres
    network_mode: host
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fe}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fe}
      POSTGRES_DB: ${POSTGRES_DB:-fe}
    volumes: [fe_pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fe} -d ${POSTGRES_DB:-fe}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7
    container_name: fe_redis
    network_mode: host

  qdrant:
    image: qdrant/qdrant:latest
    container_name: fe_qdrant
    network_mode: host
    volumes: [fe_qdrant:/qdrant/storage]

  backend:
    build: { context: ./backend }
    container_name: fe_backend
    network_mode: host
    env_file: [.env.docker]
    environment:
      TENN_HOST_NETWORK: ${TENN_HOST_NETWORK:-true}
    volumes:
      - ./backend:/app
      - ./cockpit:/app/cockpit
      - ./config:/config
      - ./data:/data
      - ./scripts:/scripts
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }
      qdrant: { condition: service_started }

  worker:
    build: { context: ./backend }
    container_name: fe_worker
    network_mode: host
    env_file: [.env.docker]
    environment:
      TENN_HOST_NETWORK: ${TENN_HOST_NETWORK:-true}
    command: ["celery", "-A", "app.celery_app.celery", "worker", "--loglevel=INFO", "-Q", "ingest,embed,score,llm_cpu,llm_gpu"]
    volumes:
      - ./backend:/app
      - ./data:/data
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }
      qdrant: { condition: service_started }

  fe_beat:
    build: { context: ./worker }
    container_name: fe_beat
    restart: unless-stopped
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    env_file: [.env.docker]
    working_dir: /app_worker
    command: ["celery", "-A", "worker_app.celery_app:celery", "beat", "--loglevel=INFO"]
    environment:
      PYTHONPATH: /app_backend:/app_worker
      BACKEND_APP_ROOT: /app_backend
    volumes:
      - ./backend:/app_backend
      - ./worker:/app_worker
      - ./data:/data
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }
      qdrant: { condition: service_started }

volumes:
  fe_pgdata:
  fe_qdrant:
