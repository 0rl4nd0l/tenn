services:
  postgres:
    image: postgres:16
    container_name: fe_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fe}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fe}
      POSTGRES_DB: ${POSTGRES_DB:-fe}
    ports: ["127.0.0.1:5432:5432"]
    volumes: [fe_pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fe} -d ${POSTGRES_DB:-fe}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7
    container_name: fe_redis
    restart: unless-stopped
    ports: ["127.0.0.1:6379:6379"]

  qdrant:
    image: qdrant/qdrant:latest
    container_name: fe_qdrant
    restart: unless-stopped
    ports: ["127.0.0.1:6333:6333"]
    volumes: [fe_qdrant:/qdrant/storage]

  backend:
    build: { context: ./backend }
    container_name: fe_backend
    restart: unless-stopped
    env_file: [.env]
    ports: ["127.0.0.1:8000:8000"]
    volumes:
      - ./backend:/app
      - ./data:/data
      - ./scripts:/scripts
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }
      qdrant: { condition: service_started }

  worker:
    build: { context: ./worker }
    container_name: fe_worker
    restart: unless-stopped
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    env_file: [.env]
    working_dir: /app_worker
    command: ["celery", "-A", "worker_app.celery_app:celery", "worker", "--loglevel=INFO", "-Q", "default"]
    environment:
      PYTHONPATH: /app_backend:/app_worker
      BACKEND_APP_ROOT: /app_backend
    volumes:
      - ./backend:/app_backend
      - ./worker:/app_worker
      - ./data:/data
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }
      qdrant: { condition: service_started }

volumes:
  fe_pgdata:
  fe_qdrant:
