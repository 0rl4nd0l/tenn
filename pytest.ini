[pytest]
asyncio_default_fixture_loop_scope = function
norecursedirs = scripts/archive
# Keep this declarative list aligned with scripts/python_import_contract.py.
pythonpath =
    .
    financial-engine_v2
    financial-engine_v2/backend
    scripts
filterwarnings =
    ignore:.*doesn't match a supported version.*
markers =
    slow: marks tests as slow (real LLM calls — skip with -m "not slow")
    live_eval: requires real LLM (llamacpp or Anthropic) and eval fixtures; run with -m live_eval
addopts = -m "not live_eval"
