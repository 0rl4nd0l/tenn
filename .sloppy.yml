mode: fix
agent: codex
timeout: 30m
max-cost: "$5.00"
max-passes: 10
min-passes: 2
max-chains: 3
model: ""
github-models-model: openai/gpt-4o-mini
scan-scope: auto
scan-provider: github-models
verbose: false
max-turns: 30
max-issues-per-pass: 0
output-file: /tmp/sloppy-scan-issues.json
parallel-agents: 1
plugins: true
custom-prompt: ""
custom-prompt-file: ""

strictness: high
min-severity: low
fail-below: 0
test-command: "npm run test:ci"

fix-types:
  - security
  - bugs
  - types
  - lint
  - dead-code
  - stubs
  - duplicates
  - coverage

rules:
  lint: medium
  dead-code: off

framework: next.js
runtime: node-20

allow:
  - pattern: "eval\\("
    reason: "Used in build-time template engine, not user input"
  - pattern: "dangerouslySetInnerHTML"
    reason: "Content is sanitized by DOMPurify upstream"

ignore:
  - "archives/"
  - "reports/"
  - "gold/"
  - "scripts/archive/"
  - "**/__pycache__/"
  - "**/*.test.ts"
  - "vendor/"
  - "generated/"
