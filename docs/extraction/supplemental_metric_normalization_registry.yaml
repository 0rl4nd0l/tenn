    why_ranked_here: Clean point-in-time balance-sheet family with stable labels across multiple filings.
  - normalized_metric_type: free_cash_flow
    coverage_doc_count: 4
    coverage_datapoint_count: 4
    why_ranked_here: Cross-document reusable and already explicit in curated results documents; preferred over raw capex variants.
  - normalized_metric_type: profit_before_taxation
    coverage_doc_count: 7
    coverage_datapoint_count: 7
    why_ranked_here: Reusable pre-tax profit family spanning several common statement labels.
