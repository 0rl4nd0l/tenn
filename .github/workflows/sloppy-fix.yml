# .github/workflows/sloppy-fix.yml
name: Sloppy Fix
on:
  # Sloppy Fix is operator-triggered only; do not schedule without explicit Tenn
  # approval because this write-capable automation runs outside task-card/registry discipline.
  workflow_dispatch:
  workflow_run:
    workflows:
      - Sloppy Scan
    types:
      - completed
jobs:
  fix:
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository)
    outputs:
      auth_enabled: ${{ steps.auth.outputs.enabled }}
    permissions:
      contents: write
      pull-requests: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.event.workflow_run.head_repository.full_name || github.repository }}
          ref: ${{ github.event.workflow_run.head_branch || github.ref_name }}

      - name: Detect Claude auth
        id: auth
        shell: bash
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [[ -n "${ANTHROPIC_API_KEY}" || -n "${CLAUDE_CODE_OAUTH_TOKEN}" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Sloppy fix (Claude)
        if: ${{ steps.auth.outputs.enabled == 'true' }}
        uses: braedonsaunders/sloppy@main
        with:
          mode: fix
          agent: claude
          model: claude-sonnet-4-5-20250929
          output-file: /tmp/sloppy-fix-issues.json
          custom-prompt-file: /dev/null
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

      - name: Skip sloppy fix (no Claude credentials)
        if: ${{ steps.auth.outputs.enabled != 'true' }}
        shell: bash
        run: |
          echo "Skipping sloppy-fix because no Claude credentials are available."

  comment:
    needs: fix
    runs-on: ubuntu-latest
    if: ${{ always() && github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository }}
    permissions:
      issues: write
      pull-requests: write
    steps:
      - name: Comment on PR
        uses: actions/github-script@v7
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          FIX_ENABLED: ${{ needs.fix.outputs.auth_enabled }}
          FIX_RESULT: ${{ needs.fix.result }}
        with:
          script: |
            const pr = context.payload.workflow_run.pull_requests?.[0];
            if (!pr) return;

            const fixEnabled = process.env.FIX_ENABLED === 'true';
            const fixResult = process.env.FIX_RESULT || 'unknown';
            let status;
            if (!fixEnabled) {
              status = 'Sloppy Fix ran automatically after Sloppy Scan, but no Claude credentials were available.';
            } else if (fixResult === 'success') {
              status = 'Sloppy Fix completed automatically after Sloppy Scan.';
            } else {
              status = `Sloppy Fix attempted automatically after Sloppy Scan and ended with ${fixResult}.`;
            }

            const comment = [
              status,
              `Run: ${process.env.RUN_URL}`,
            ].join('\n');

            try {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                body: comment,
              });
            } catch (error) {
              core.warning(`Unable to comment on PR #${pr.number}: ${error.message}`);
            }
