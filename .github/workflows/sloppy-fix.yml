# .github/workflows/sloppy-fix.yml
name: Sloppy Fix
on:
  # Sloppy Fix is operator-triggered only; do not schedule without explicit Tenn
  # approval because this write-capable automation runs outside task-card/registry discipline.
  workflow_dispatch:
jobs:
  fix:
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Detect Claude auth
        id: auth
        shell: bash
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [[ -n "${ANTHROPIC_API_KEY}" || -n "${CLAUDE_CODE_OAUTH_TOKEN}" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Sloppy fix (Claude)
        if: ${{ steps.auth.outputs.enabled == 'true' }}
        uses: braedonsaunders/sloppy@main
        with:
          mode: fix
          agent: claude
          model: claude-sonnet-4-5-20250929
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

      - name: Skip sloppy fix (no Claude credentials)
        if: ${{ steps.auth.outputs.enabled != 'true' }}
        shell: bash
        run: |
          echo "Skipping sloppy-fix because no Claude credentials are available."
