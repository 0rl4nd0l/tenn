# .github/workflows/sloppy-fix.yml
name: Sloppy Fix
on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - Sloppy Scan
    types:
      - completed
jobs:
  fix:
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository)
    permissions:
      contents: write
      issues: write
      pull-requests: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      CODEX_MODEL: gpt-5.2-codex
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.event.workflow_run.head_repository.full_name || github.repository }}
          ref: ${{ github.event.workflow_run.head_branch || github.ref_name }}

      - name: Codex CLI compatibility shim
        shell: bash
        run: |
          mkdir -p .github/bin
          cat > .github/bin/codex <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail

          args=()
          for arg in "$@"; do
            if [[ "$arg" == "--quiet" ]]; then
              continue
            fi
            args+=("$arg")
          done

          npm_root="$(npm root -g 2>/dev/null || true)"
          for candidate in \
            "$npm_root/@openai/codex/bin/codex.js" \
            "$npm_root/@openai/codex/dist/cli.js" \
            "$npm_root/@openai/codex/cli.js"; do
            if [[ -f "$candidate" ]]; then
              exec node "$candidate" "${args[@]}"
            fi
          done

          exec npx -y @openai/codex "${args[@]}"
          EOF
          chmod +x .github/bin/codex
          echo "$PWD/.github/bin" >> "$GITHUB_PATH"

      - name: Detect Claude auth
        id: auth
        shell: bash
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [[ -n "${OPENAI_API_KEY}" || -n "${ANTHROPIC_API_KEY}" || -n "${CLAUDE_CODE_OAUTH_TOKEN}" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Sloppy fix (Codex)
        if: ${{ steps.auth.outputs.enabled == 'true' }}
        uses: braedonsaunders/sloppy@main
        with:
          mode: fix
          agent: codex
          model: ${{ env.CODEX_MODEL }}
          verbose: true
          output-file: /tmp/sloppy-fix-issues.json
          custom-prompt-file: /dev/null
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

      - name: Skip sloppy fix (no fix credentials)
        if: ${{ steps.auth.outputs.enabled != 'true' }}
        shell: bash
        run: |
          echo "Skipping sloppy-fix because no sloppy-fix agent credentials are available."

      - name: Comment on PR
        if: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.pull_requests[0] }}
        uses: actions/github-script@v7
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          FIX_ENABLED: ${{ steps.auth.outputs.enabled }}
        with:
          script: |
            const pr = context.payload.workflow_run.pull_requests?.[0];
            if (!pr) return;

            const comment = [
              process.env.FIX_ENABLED === 'true'
                ? 'Sloppy Fix completed automatically after Sloppy Scan.'
                : 'Sloppy Fix ran automatically after Sloppy Scan, but no fix credentials were available.',
              `Run: ${process.env.RUN_URL}`,
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              body: comment,
            });
