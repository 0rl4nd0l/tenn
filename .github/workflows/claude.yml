name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  # Manual dispatch keeps advisory scans available without automatic PR write-back.
  workflow_dispatch:

jobs:
  claude-on-mention:
    # Respond to @claude mentions in issue/PR comments
    if: >
      (github.event_name == 'issue_comment' || github.event_name == 'pull_request_review_comment') &&
      contains(github.event.comment.body, '@claude')
    runs-on: ubuntu-latest
    permissions:
      # Least privilege: commenting only, no repository content writes.
      contents: read
      pull-requests: write
      issues: write
    steps:
      # Pinned to immutable commit SHA for supply-chain safety.
      - uses: anthropics/claude-code-action@de8e0b9c42c6cb58e904c857f164aa072244c1ac
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}

  claude-manual-advisory:
    # Manual-only advisory run; no automatic PR review trigger.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - uses: anthropics/claude-code-action@de8e0b9c42c6cb58e904c857f164aa072244c1ac
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          direct_prompt: |
            Run an advisory-only repository review. Focus on:
            - security and secret-handling risks
            - CI/workflow safety and least-privilege permissions
            - startup and runtime determinism mismatches in docs/scripts
            Return a concise findings summary.
