name: CodeQL

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: "23 3 * * 1"

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze (python)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [python]

    steps:
      # Pinned to immutable commit SHA for supply-chain safety.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      # Pinned to immutable commit SHA for supply-chain safety.
      - uses: github/codeql-action/init@3b1a19a80ab047f35cbb237b5bd9bdc1e14f166c
        with:
          languages: ${{ matrix.language }}
          queries: security-extended,security-and-quality

      # Pinned to immutable commit SHA for supply-chain safety.
      - uses: github/codeql-action/analyze@3b1a19a80ab047f35cbb237b5bd9bdc1e14f166c
